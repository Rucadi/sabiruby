[package]
name = "sabiruby-rgss-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Embeddable RGSS runtime services for SabiRuby"
license = "MIT"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
fontdue = "0.9"
flate2 = "1.1.10"
gif = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
ogg = "0.9"
sabiruby = { path = "../..", features = ["std"] }
sabiruby-compiler = { path = "../../compiler", features = ["host"] }
theora-rs = "0.1"
