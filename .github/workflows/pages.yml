name: pages
# The pages at https://sabiruby.github.io/sabiruby/: SabiRuby's compatibility report
# (docs/verification/edge-compare/index.html and the two SabiRuby JSON reports it is made from,
# generated by tools/edge_compare.sh) and docs/compare/. Nothing is built here: the pages are
# committed as they are generated, and this only copies them into the site. compare.html and
# mrubyedge.json in the same directory are a development record and are not copied.
on:
  push:
    branches: [main]
    paths: ['docs/verification/edge-compare/**', 'docs/compare/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: site
        run: |
          mkdir -p _site/edge-compare _site/compare
          cp docs/verification/edge-compare/index.html docs/verification/edge-compare/sabiruby.json \
             docs/verification/edge-compare/sabiruby-fixtures.json _site/edge-compare/
          cp docs/compare/mrubyedge.html _site/compare/
          cp docs/compare/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
